<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChattyFriends by Carlos</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; min-height: 100vh; background: #e3effd; }

    /* --- LOGIN (GRANDE Y CENTRADO) --- */
    #login-screen { display: flex; justify-content: center; align-items: center; min-height: 100dvh; }
    .login-card { 
      background: #fff; 
      border-radius: 24px; 
      padding: 50px 40px; 
      width: 450px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
      text-align: center; 
    }
    .login-card h1 { font-size: 42px; margin-bottom: 25px; color: #000; font-weight: bold; }
    .login-card input { 
      width: 100%; 
      padding: 15px; 
      margin-bottom: 1px; /* Pegados como en tu imagen */
      border: 1px solid #999; 
      font-size: 18px; 
      outline: none; 
    }
    .btn-login { 
      width: 100%; 
      padding: 18px; 
      border: none; 
      border-radius: 12px; 
      color: #fff; 
      font-size: 20px; 
      font-weight: 600; 
      cursor: pointer; 
      margin-top: 15px;
      transition: 0.2s;
    }
    .btn-reg { background: #4ba3f1; }
    .btn-ini { background: #1b66c9; }
    .forgot-pass-link {
      display: inline-block;
      margin-top: 12px;
      color: #1b66c9;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .forgot-pass-link:hover { text-decoration: underline; }

    /* --- ESTRUCTURA DEL CHAT --- */
    #chat-screen { display: none; height: 100vh; min-height: 100vh; flex-direction: row; background: #fff; overflow: hidden; }
    
    .sidebar { 
      width: 320px; 
      background: #fff; 
      border-right: 1px solid #eee; 
      display: flex; 
      flex-direction: column;
      min-height: 0;
      overflow-y: auto;
    }
    
    .sidebar-header { padding: 20px; border-bottom: 1px solid #f5f5f5; }

    /* LISTAS CON SCROLL (Maximo 3-4 items visibles) */
    .scroll-container {
      max-height: 220px; 
      overflow-y: auto;
      padding: 10px;
      background: #fdfdfd;
      margin: 5px 10px;
      border-radius: 10px;
      border: 1px solid #f0f0f0;
    }

    .section-label {
      padding: 15px 20px 5px;
      font-size: 13px;
      font-weight: bold;
      color: #2e7d32;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
    }

    /* INPUTS DE LA SIDEBAR (Mas limpios) */
    .sidebar-form { padding: 10px 20px 20px; }
    .sidebar-form input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 5px; font-size: 14px; }
    .btn-sidebar { width: 100%; padding: 10px; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; margin-bottom: 5px; }

    /* ITEMS */
    .chat-item { 
      padding: 12px; 
      margin-bottom: 8px; 
      background: #fff; 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      cursor: pointer;
      border: 1px solid #f0f0f0;
      transition: 0.2s;
    }
    .chat-item:hover { background: #f0f7ff; }
    .chat-item.active { background: #e3f2fd; border-color: #4ba3f1; }
    .chat-item-main { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
    .chat-item-text { min-width:0; flex:1; }
    .chat-item-text b, .chat-item-text small { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-item-badge { min-width:22px; height:22px; padding:0 6px; border-radius:999px; background:#e53935; color:#fff; display:none; align-items:center; justify-content:center; font-size:12px; font-weight:700; box-shadow:0 4px 10px rgba(229,57,53,.28); }
    .chat-item.has-unread .chat-item-badge { display:inline-flex; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #4ba3f1; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    /* CHAT AREA */
    .chat-area { flex: 1; min-width:0; min-height:0; display: flex; flex-direction: column; position:relative; }
    .chat-messages { flex: 1; min-height:0; padding: 20px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 12px; border-radius: 15px; font-size: 15px; word-break: break-word; }
    .msg.sent { align-self: flex-end; background: #1b66c9; color: #fff; }
    .msg.received { align-self: flex-start; background: #eee; }
    .msg img.file-img { max-width: 100%; border-radius: 10px; cursor: pointer; display: block; margin-top: 4px; }
    .msg video, .msg audio { max-width: 100%; margin-top: 4px; border-radius: 8px; }
    .msg .file-card { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.08); margin-top: 4px; text-decoration: none; color: inherit; }
    .msg.sent .file-card { background: rgba(255,255,255,.15); }
    .msg .file-card .file-icon { font-size: 24px; }
    .msg .file-card .file-info { font-size: 12px; line-height: 1.3; }
    .msg .file-card .file-name { font-weight: 600; font-size: 13px; }
    .msg { position: relative; }
    .msg .msg-actions { display:none; position:absolute; top:4px; right:6px; gap:2px; }
    .msg.sent:hover .msg-actions { display:flex; }
    .msg .msg-actions button { background:rgba(255,255,255,.25); border:none; cursor:pointer; font-size:13px; padding:2px 5px; border-radius:6px; color:#fff; line-height:1; }
    .msg .msg-actions button:hover { background:rgba(255,255,255,.45); }
    .msg .msg-edited { font-size:10px; opacity:.6; margin-top:4px; display:block; }
    .msg-edit-bar { display:none; padding:8px 20px; background:#fff3cd; border-top:1px solid #ffe082; align-items:center; gap:10px; font-size:13px; }
    .msg-edit-bar.visible { display:flex; }
    .msg-edit-bar span { color:#e65100; font-weight:600; }
    .msg-edit-bar button { background:none; border:none; cursor:pointer; font-size:18px; padding:2px 6px; border-radius:6px; }
    .msg-edit-bar button:hover { background:#ffe082; }

    .chat-input-bar { flex-shrink:0; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #eee; align-items: center; }
    .chat-input-bar input[type=text] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
    .chat-input-bar button { background: #1b66c9; color: white; border: none; padding: 10px 25px; border-radius: 25px; cursor: pointer; }
    .btn-clip { background: none; border: none; font-size: 22px; cursor: pointer; padding: 6px; border-radius: 50%; transition: .2s; }
    .btn-clip:hover { background: #e0e0e0; }
    .btn-mic { background: none; border: none; font-size: 22px; cursor: pointer; padding: 6px; border-radius: 50%; transition: .2s; }
    .btn-mic:hover { background: #e0e0e0; }
    .btn-mic.recording { background: #ffebee; color: #d32f2f; }
    .audio-compose-bar { display:none; padding:10px 20px; border-top:1px solid #eee; background:#f8fcfb; align-items:center; gap:10px; }
    .audio-compose-bar.visible { display:flex; }
    .audio-compose-bar audio { flex:1; min-width:0; }
    .audio-compose-actions { display:flex; gap:8px; }
    .btn-audio-send { background:#1b66c9; color:#fff; border:none; border-radius:18px; padding:8px 14px; cursor:pointer; }
    .btn-audio-delete { background:#f44336; color:#fff; border:none; border-radius:18px; padding:8px 14px; cursor:pointer; }
    .clip-panel {
      display:none;
      position:absolute;
      inset:0;
      z-index:20;
      background:#0f1722;
      color:#fff;
      padding:10px;
      box-sizing:border-box;
      flex-direction:column;
      gap:10px;
    }
    .clip-panel.visible { display:flex; }
    .clip-top { display:flex; gap:8px; justify-content:space-between; }
    .clip-top-left, .clip-top-right { display:flex; gap:8px; }
    .clip-btn {
      border:none;
      border-radius:10px;
      background:#1f2d40;
      color:#fff;
      padding:8px 12px;
      font-size:13px;
      cursor:pointer;
      font-weight:700;
    }
    .clip-btn.warn { background:#2f465f; }
    .clip-preview-wrap {
      position:relative;
      flex:1;
      min-height:180px;
      border-radius:14px;
      overflow:hidden;
      background:#000;
      border:1px solid #213147;
    }
    .clip-preview-video { width:100%; height:100%; object-fit:cover; background:#000; }
    .clip-record-dot {
      position:absolute;
      top:10px;
      left:10px;
      display:none;
      width:10px;
      height:10px;
      border-radius:50%;
      background:#f44336;
      box-shadow:0 0 0 3px rgba(244,67,54,.25);
      animation:gcPulse 1s infinite;
    }
    .clip-record-dot.visible { display:block; }
    .clip-bottom { display:flex; justify-content:center; }
    .clip-capture-btn {
      width:84px;
      height:84px;
      border-radius:50%;
      border:4px solid #fff;
      background:#1b66c9;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
    .clip-capture-btn.recording { background:#f44336; }
    .clip-recent-bar {
      display:flex;
      gap:8px;
      overflow-x:auto;
      padding:2px 0 4px;
      min-height:64px;
    }
    .clip-recent-item {
      flex:0 0 auto;
      width:72px;
      height:58px;
      border:none;
      border-radius:10px;
      overflow:hidden;
      background:#111;
      padding:0;
      cursor:pointer;
      position:relative;
      border:1px solid #2f435a;
    }
    .clip-recent-item img, .clip-recent-item video {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .clip-recent-empty {
      color:#9bb0c7;
      font-size:12px;
      padding:4px 0;
    }
    .msg .msg-gif, .msg .msg-sticker { max-width:220px; border-radius:12px; display:block; }
    .msg .msg-sticker { background:#fff; }

    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 28px; border-radius: 10px; color: #fff; font-size: 15px;
      z-index: 9999; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.15);
      animation: toastIn .3s;
    }
    .toast.error { background: #f44336; }
    .toast.success { background: #4caf50; }
    @keyframes toastIn { from { opacity:0; transform:translateX(-50%) translateY(-10px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }

    /* MODAL VERSION */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:10000; display:flex; justify-content:center; align-items:center; animation: fadeInBg .3s; }
    @keyframes fadeInBg { from{opacity:0} to{opacity:1} }
    .modal-card { background:#fff; border-radius:20px; padding:36px 32px; width:420px; max-width:90vw; box-shadow:0 12px 40px rgba(0,0,0,.2); text-align:center; animation: modalPop .3s; }
    @keyframes modalPop { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }
    .modal-card h2 { font-size:28px; margin-bottom:6px; }
    .modal-card .ver-tag { display:inline-block; background:#1b66c9; color:#fff; padding:4px 14px; border-radius:20px; font-size:13px; font-weight:700; margin-bottom:16px; }
    .modal-card ul { text-align:left; margin:16px 0; padding-left:20px; }
    .modal-card li { margin-bottom:8px; font-size:14px; color:#444; }
    .modal-card li b { color:#1b66c9; }
    .modal-card button { margin-top:10px; padding:12px 40px; background:#1b66c9; color:#fff; border:none; border-radius:12px; font-size:16px; font-weight:600; cursor:pointer; }

    /* PROFILE PIC */
    .profile-area { position:relative; width:64px; height:64px; margin:0 auto 10px; cursor:pointer; }
    .profile-area img { width:64px; height:64px; border-radius:50%; object-fit:cover; border:3px solid #1b66c9; }
    .profile-area .avatar-letter { width:64px; height:64px; border-radius:50%; background:#1b66c9; color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; border:3px solid #1b66c9; }
    .profile-area .cam-badge { position:absolute; bottom:0; right:0; background:#fff; border-radius:50%; width:22px; height:22px; display:flex; align-items:center; justify-content:center; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.2); }
    .avatar-img { width:40px; height:40px; border-radius:50%; object-fit:cover; }
    .avatar-menu { position:absolute; top:68px; left:50%; transform:translateX(-50%); background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.18); z-index:100; overflow:hidden; display:none; min-width:160px; }
    .avatar-menu button { display:block; width:100%; padding:12px 18px; border:none; background:none; font-size:14px; text-align:left; cursor:pointer; }
    .avatar-menu button:hover { background:#f0f7ff; }
    .avatar-menu .remove-btn { color:#f44336; }
    .ver-badge { display:inline-block; background:#e3f2fd; color:#1b66c9; padding:3px 12px; border-radius:20px; font-size:11px; font-weight:700; cursor:pointer; margin-top:6px; transition:.2s; }
    .ver-badge:hover { background:#1b66c9; color:#fff; }

    /* CROP MODAL */
    .crop-modal { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:10001; display:none; justify-content:center; align-items:center; }
    .crop-card { background:#fff; border-radius:20px; padding:28px; width:340px; text-align:center; }
    .crop-card h3 { margin-bottom:14px; font-size:18px; }
    .crop-viewport { width:220px; height:220px; margin:0 auto; border-radius:50%; overflow:hidden; position:relative; cursor:grab; border:3px solid #1b66c9; background:#000; }
    .crop-viewport:active { cursor:grabbing; }
    .crop-viewport img { position:absolute; top:0; left:0; transform-origin:0 0; pointer-events:none; user-select:none; -webkit-user-drag:none; }
    .crop-slider { width:200px; margin:14px auto 0; display:block; accent-color:#1b66c9; }
    .crop-btns { display:flex; gap:10px; justify-content:center; margin-top:16px; }
    .crop-btns button { padding:10px 28px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; }
    .crop-btn-save { background:#1b66c9; color:#fff; }
    .crop-btn-cancel { background:#eee; color:#444; }

    /* CALL MODAL */
    .call-overlay { position:fixed; inset:0; background:transparent; z-index:10002; display:none; justify-content:flex-end; align-items:flex-end; padding:16px; pointer-events:none; }
    .call-overlay.incoming { background:rgba(0,0,0,.7); justify-content:center; align-items:center; padding:0; pointer-events:auto; animation: fadeInBg .3s; }
    .call-card { background:#fff; border-radius:24px; padding:28px 24px; width:340px; max-width:92vw; text-align:center; animation: modalPop .3s; pointer-events:auto; box-shadow:0 14px 36px rgba(0,0,0,.26); }
    .call-card .call-avatar { width:80px; height:80px; border-radius:50%; background:#1b66c9; color:#fff; display:flex; align-items:center; justify-content:center; font-size:36px; font-weight:700; margin:0 auto 16px; }
    .call-card .call-name { font-size:22px; font-weight:700; margin-bottom:4px; }
    .call-card .call-status { font-size:14px; color:#888; margin-bottom:24px; }
    .call-card .call-timer { font-size:18px; font-weight:600; color:#1b66c9; margin-bottom:20px; display:none; }
    .call-card .call-muted-line { display:none; margin:-10px 0 14px; font-size:12px; color:#f44336; font-weight:700; }
    .call-video-wrap { display:none; position:relative; width:100%; max-width:460px; margin:0 auto 16px; border-radius:16px; overflow:hidden; background:#111; aspect-ratio:16/9; }
    .call-video-wrap.active { display:block; }
    .call-video-remote { width:100%; height:100%; object-fit:cover; background:#111; }
    .call-video-local { position:absolute; right:12px; bottom:12px; width:32%; max-width:132px; border-radius:10px; border:2px solid rgba(255,255,255,.85); object-fit:cover; background:#000; aspect-ratio:16/9; }

    .call-btns { display:flex; gap:16px; justify-content:center; }
    .call-btn { width:56px; height:56px; border-radius:50%; border:none; font-size:24px; cursor:pointer; transition:.2s; display:flex; align-items:center; justify-content:center; }
    .call-btn-end { background:#f44336; color:#fff; }
    .call-btn-end:hover { background:#d32f2f; }
    .call-btn-accept { background:#4caf50; color:#fff; }
    .call-btn-accept:hover { background:#388e3c; }
    .call-btn-mute { background:#eee; color:#444; }
    .call-btn-mute.muted { background:#ff9800; color:#fff; }
    .btn-call-header { background:none; border:none; font-size:22px; cursor:pointer; padding:6px 10px; border-radius:50%; transition:.2s; }
    .btn-call-header:hover { background:#e3f2fd; }
    .chat-header { display:flex; align-items:center; justify-content:space-between; }
    .chat-header-actions { display:flex; gap:8px; }
    .mobile-back-btn {
      display:none;
      border:none;
      background:#eef4ff;
      color:#1b66c9;
      width:34px;
      height:34px;
      border-radius:999px;
      font-size:18px;
      cursor:pointer;
      align-items:center;
      justify-content:center;
      margin-right:8px;
    }
    .chat-header-main { display:flex; align-items:center; min-width:0; }
    .chat-header-main h3 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    /* GROUP CALL BANNER */
    .gcall-banner { display:none; padding:10px 20px; background:linear-gradient(135deg,#e8f5e9,#c8e6c9); border-bottom:1px solid #a5d6a7; align-items:center; gap:12px; animation: fadeInBg .3s; }
    .gcall-banner.visible { display:flex; }
    .gcall-banner .gcall-icon { font-size:20px; animation: gcPulse 1.5s infinite; }
    @keyframes gcPulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .gcall-banner .gcall-info { flex:1; font-size:13px; color:#2e7d32; font-weight:600; }
    .gcall-banner .gcall-info small { font-weight:400; color:#555; }
    .btn-join-call { padding:8px 20px; background:#4caf50; color:#fff; border:none; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer; transition:.2s; }
    .btn-join-call:hover { background:#388e3c; }

    /* TABLETS */
    @media (max-width: 1100px) {
      .login-card {
        width: min(92vw, 460px);
        padding: 40px 28px;
      }
      .login-card h1 { font-size: 34px; }
      .sidebar { width: 280px; }
      .chat-messages { padding: 14px; }
      .chat-input-bar { padding: 14px; }
      .msg { max-width: 82%; }
      .scroll-container { max-height: 180px; }
    }

    /* MOBILE + TABLET (estilo WhatsApp) */
    @media (max-width: 1024px) {
      html, body {
        overflow: hidden;
        height: 100dvh;
      }
      #chat-screen {
        flex-direction: row;
        height: 100dvh;
        min-height: 100dvh;
      }
      .sidebar {
        width: 100%;
        max-height: 100dvh;
        border-right: none;
        border-bottom: none;
      }
      .sidebar-header { padding: 12px; }
      .section-label { padding: 10px 14px 4px; }
      .scroll-container {
        max-height: 190px;
        margin: 4px 10px;
      }
      .sidebar-form { padding: 8px 12px 12px; }
      .chat-area {
        flex: 1;
        min-height: 0;
        display: none;
      }
      #chat-screen.mobile-show-chat .sidebar { display: none; }
      #chat-screen.mobile-show-chat .chat-area { display: flex; }
      .chat-header {
        padding: 12px !important;
      }
      .mobile-back-btn { display:inline-flex; }
      .chat-messages {
        padding: 10px;
      }
      .msg {
        max-width: 90%;
        font-size: 14px;
      }
      .chat-input-bar {
        padding: 10px;
        gap: 8px;
      }
      .chat-input-bar input[type=text] {
        min-width: 0;
        font-size: 16px;
        padding: 10px 12px;
      }
      .chat-input-bar button {
        padding: 9px 14px;
      }
      .btn-clip, .btn-mic {
        font-size: 20px;
        padding: 4px;
      }
      .call-card {
        width: min(92vw, 360px);
        padding: 22px 18px;
      }
    }

    @media (max-width: 520px) {
      .login-card {
        width: 94vw;
        padding: 26px 16px;
        border-radius: 16px;
      }
      .login-card h1 { font-size: 30px; }
      .profile-area,
      .profile-area img,
      .profile-area .avatar-letter {
        width: 56px;
        height: 56px;
      }
      .chat-header h3 {
        font-size: 16px;
      }
      .chat-header-main h3 {
        font-size: 16px;
      }
      .btn-call-header {
        font-size: 20px;
        padding: 4px 8px;
      }
      .chat-input-bar button {
        border-radius: 18px;
      }
      #btn-send-msg {
        padding: 9px 12px;
      }
    }
  </style>
</head>
<body>

<div id="toast" class="toast"></div>
<div id="version-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeVersionModal()">
  <div class="modal-card">
    <h2>ChattyFriends</h2>
    <span class="ver-tag" id="ver-tag"></span>
    <p style="color:#888;font-size:13px;margin-bottom:10px">Novedades de esta versi&oacute;n:</p>
    <div id="changelog-list"></div>
    <button onclick="closeVersionModal()">Entendido</button>
  </div>
</div>

<div id="call-modal" class="call-overlay" onclick="">
  <div class="call-card">
    <div id="call-video-wrap" class="call-video-wrap">
      <video id="call-video-remote" class="call-video-remote" autoplay playsinline></video>
      <video id="call-video-local" class="call-video-local" autoplay playsinline muted></video>

        cropNatW = img.naturalWidth;
        cropNatH = img.naturalHeight;
        var vp = 220;
        var fitScale = Math.max(vp / cropNatW, vp / cropNatH);
        cropScale = fitScale;
        cropX = (vp - cropNatW * cropScale) / 2;
        cropY = (vp - cropNatH * cropScale) / 2;
        document.getElementById('crop-zoom').min = Math.round(fitScale * 100);
        document.getElementById('crop-zoom').max = Math.round(fitScale * 300);

    img.style.left = cropX + 'px';
    img.style.top = cropY + 'px';

  function updateCropZoom(val) {
    var vp = 220;
    var oldScale = cropScale;
    cropScale = val / 100;
    var cx = vp / 2, cy = vp / 2;
    cropX = cx - (cx - cropX) * (cropScale / oldScale);
    cropY = cy - (cy - cropY) * (cropScale / oldScale);
    applyCropTransform();

      applyCropTransform(); e.preventDefault();

      var vp = 220, outSize = 256;
      var srcImg = new Image();
      srcImg.src = cropDataUrl;
      await new Promise(function(ok, fail) { srcImg.onload = ok; srcImg.onerror = fail; });
      var canvas = document.createElement('canvas');
      canvas.width = outSize; canvas.height = outSize;
      var ctx = canvas.getContext('2d');
      var ratio = outSize / vp;
      ctx.drawImage(srcImg, cropX * ratio, cropY * ratio, cropNatW * cropScale * ratio, cropNatH * cropScale * ratio);
      var avatarBlob = await new Promise(function(resolve) {
        canvas.toBlob(function(blob) { resolve(blob); }, 'image/jpeg', 0.88);
      });

  async function moderateTextWithAI(text) {
    var input = (text || '').trim();
    if (!input) return { allowed: true, category: 'empty', reason: '' };
    try {
      var res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + MODERATION_API_KEY },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          temperature: 0,
          messages: [
            {
              role: 'system',
              content: 'Clasifica texto de chat. Detecta garabatos, spam, insultos graves, amenazas, sexual explicito, odio o contenido peligroso. Responde SOLO JSON valido con esta forma exacta: {"allowed":true|false,"category":"clean|gibberish|spam|insult|threat|sexual|hate|dangerous","reason":"motivo corto en espanol"}. allowed=false si el mensaje debe bloquearse.'
            },
            { role: 'user', content: input }
          ]
        })
      });
      var data = await res.json();
      var raw = data && data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '';
      if (!raw) return { allowed: true, category: 'clean', reason: '' };
      var match = raw.match(/\{[\s\S]*\}/);
      var parsed = JSON.parse(match ? match[0] : raw);
      return {
        allowed: parsed.allowed !== false,
        category: parsed.category || 'clean',
        reason: parsed.reason || ''
      };
    } catch (_) {
      return { allowed: true, category: 'fallback', reason: '' };
    }
  }

    clipRecorder.onstop = async function() {
      if (!clipRecorderChunks.length) return;

  async function sha256Hex(text) {
    var enc = new TextEncoder();
    var bytes = enc.encode(text || '');
    var hash = await crypto.subtle.digest('SHA-256', bytes);
    var arr = Array.from(new Uint8Array(hash));
    return arr.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  function isHashedPassword(value) {
    return typeof value === 'string' && value.indexOf('sha256$') === 0;
  }

  async function hashPasswordForStorage(password) {
    return 'sha256$' + (await sha256Hex(password));
  }

  async function login() {
    const u = document.getElementById('auth-user').value.trim();
    const p = document.getElementById('auth-pass').value;
    if (!u || !p) return toast('Completa todos los campos');
    const { data, error } = await sb.from('profiles').select('*').eq('username', u).maybeSingle();
    if (error) return toast('Error: ' + error.message);
    if(!data) return toast('Datos incorrectos');

    var stored = data.clave || '';
    var ok = false;

    if (isHashedPassword(stored)) {
      var hashedInput = await hashPasswordForStorage(p);
      ok = stored === hashedInput;
    } else {
      ok = stored === p;
      if (ok) {
        // Migracion automatica sin perder usuarios existentes.
        var migrated = await hashPasswordForStorage(p);
        await sb.from('profiles').update({ clave: migrated }).eq('id', data.id);
      }
    }

    if (!ok) return toast('Datos incorrectos');
    currentUser = sanitizeUser(data);
    localStorage.setItem('chatty_user', JSON.stringify(currentUser));
    chattySyncNativeSession();
    startApp();
  }

  function render(msgs, isGroup = false) {
    const c = document.getElementById('chat-messages');
    c.innerHTML = '';
    var table = isGroup ? 'group_messages' : 'messages';
    msgs.forEach(m => {
      const isMe = m.sender_id === currentUser.id;
      const div = document.createElement('div');
      div.className = 'msg ' + (isMe ? 'sent' : 'received');
      const sender = (!isMe && isGroup) ? '<b style="font-size:10px">' + (m.profiles?.username || '?') + '</b><br>' : '';
      var body;
      if (m.content && m.content.indexOf('<<FILE>>') === 0) {
        body = renderFileContent(m.content, isMe);
      } else if (isMediaMessage(m.content)) {
        body = renderMediaContent(m.content);
      } else {
        body = m.content;
      }
      var actions = '';
      if (isMe) {
        var isFile = m.content && m.content.indexOf('<<FILE>>') === 0;
        var isMedia = isMediaMessage(m.content);
        actions = '<div class="msg-actions">';
        if (!isFile && !isMedia) actions += '<button onclick="startEditMsg(\'' + m.id + '\',\'' + table + '\')" title="Editar">&#x270F;</button>';
        actions += '<button onclick="deleteMsg(\'' + m.id + '\',\'' + table + '\')" title="Eliminar">&#x1F5D1;</button>';

  function getVoiceExtension(mime) {

  async function startAudioRecord() {
    unlockSounds();
    if (!chatMode) return toast('Selecciona un chat primero');
    if (chatMode === 'private' && activeFriend && BLOCKED_CHAT_BOT_IDS.indexOf(activeFriend.id) > -1) {
      toast('A este bot no se le puede enviar nada');
      return;
    }
    if (recordedVoiceUrl) discardRecordedAudio();

    try {
      voiceStream = await requestUserMediaWithFallback('audio');
    } catch (e) {
      toast(mediaPermissionMessage(e, 'audio'));
      return;
    }

    voiceChunks = [];
    var recorderOptions = {};
    if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) recorderOptions.mimeType = 'audio/webm;codecs=opus';
    else if (MediaRecorder.isTypeSupported('audio/webm')) recorderOptions.mimeType = 'audio/webm';
    else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) recorderOptions.mimeType = 'audio/ogg;codecs=opus';
    else if (MediaRecorder.isTypeSupported('audio/mp4')) recorderOptions.mimeType = 'audio/mp4';
    voiceRecorder = new MediaRecorder(voiceStream, recorderOptions);
    voiceRecorder.ondataavailable = function(ev) {
      if (ev.data && ev.data.size > 0) voiceChunks.push(ev.data);
    };
    voiceRecorder.onstop = function() {
      if (!voiceChunks.length) {
        toast('No se detecto audio. Intenta grabar de nuevo');
        document.getElementById('btn-mic').classList.remove('recording');
        if (voiceStream) voiceStream.getTracks().forEach(function(t) { t.stop(); });
        voiceStream = null;
        voiceRecorder = null;
        return;
      }
      var mime = voiceRecorder.mimeType || 'audio/webm';
      recordedVoiceBlob = new Blob(voiceChunks, { type: mime });
      if (recordedVoiceUrl) URL.revokeObjectURL(recordedVoiceUrl);
      recordedVoiceUrl = URL.createObjectURL(recordedVoiceBlob);
      var preview = document.getElementById('audio-preview');
      preview.src = recordedVoiceUrl;
      preview.muted = false;
      preview.volume = 1;
      preview.load();
      preview.play().catch(function() {});
      document.getElementById('audio-compose-bar').classList.add('visible');
      document.getElementById('btn-mic').classList.remove('recording');
      voiceStream.getTracks().forEach(function(t) { t.stop(); });
      voiceStream = null;
      voiceRecorder = null;
      voiceChunks = [];
    };

    voiceRecorder.start();
    document.getElementById('btn-mic').classList.add('recording');
    toast('Grabando audio... pulsa microfono para detener', 'success');
  }

  async function uploadAndSendSingleFile(file) {
    if (!file) return false;
    if (file.size > 50 * 1024 * 1024) {
      toast('Archivo demasiado grande (max 50MB): ' + (file.name || 'archivo'));
      return false;
    }

    var ts = Date.now() + Math.floor(Math.random() * 1000);
    var fileName = file.name || ('archivo_' + ts);
    var safeName = fileName.replace(/[^a-zA-Z0-9._-]/g, '_');
    var path = currentUser.id + '/' + ts + '_' + safeName;
    var up = await sb.storage.from('chat-files').upload(path, file, { upsert: true });
    if (up.error) {
      toast('Error al subir ' + fileName + ': ' + up.error.message);
      return false;
    }

    var ext = '';
    var dotIdx = fileName.lastIndexOf('.');
    if (dotIdx > -1 && dotIdx < fileName.length - 1) ext = fileName.substring(dotIdx + 1).toLowerCase();
    var detectedType = file.type || 'application/octet-stream';
    var displayName = ext ? ('archivo.' + ext) : fileName;
    var meta = JSON.stringify({ path: path, displayName: displayName, type: detectedType, size: file.size || 0 });
    var content = '<<FILE>>' + meta + '<<FILE>>';

    if (chatMode === 'private') {
      await sb.from('messages').insert({ sender_id: currentUser.id, receiver_id: activeFriend.id, content: content });
    } else {
      await sb.from('group_messages').insert({ group_id: activeGroup.id, sender_id: currentUser.id, content: content });
    }
    playAppSound('messageSent');
    return true;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function renderFileContent(content, isSent) {
    try {
      var json = content.replace(/<<FILE>>/g, '');
      var f = JSON.parse(json);
      var t = f.type || '';
      var url = f.url || '';
      if (!url && f.path) {
        var pub = sb.storage.from('chat-files').getPublicUrl(f.path);
        if (pub && pub.data && pub.data.publicUrl) url = pub.data.publicUrl;
      }
      var fileName = f.name || f.displayName || 'archivo';
      if (!url) return 'Archivo no disponible';
      if (t.startsWith('image/')) {
        return '<img class="file-img" src="' + url + '" alt="' + fileName + '" onclick="window.open(this.src)" />';
      }
      if (t.startsWith('video/')) {
        return '<video controls preload="metadata"><source src="' + url + '"></video>';
      }
      if (t.startsWith('audio/')) {
        return '<audio controls playsinline preload="metadata"><source src="' + url + '"></audio>';
      }
      var icon = '\uD83D\uDCC4';
      if (t.includes('pdf')) icon = '\uD83D\uDCC3';
      if (t.includes('zip') || t.includes('rar') || t.includes('7z')) icon = '\uD83D\uDDC4';
      var linkColor = isSent ? 'color:#fff' : 'color:#222';
      return '<a class="file-card" href="' + url + '" target="_blank" style="' + linkColor + '">'
        + '<span class="file-icon">' + icon + '</span>'
        + '<div><div class="file-name">' + fileName + '</div>'
        + '<div class="file-info">' + formatSize(f.size) + '</div></div></a>';
    } catch(e) { return content; }
  }

  var callPeer = null, localStream = null, callChannel = null;
  var callState = 'idle'; // idle | calling | ringing | active
  var callTimerInterval = null, callSeconds = 0;
  var isMuted = false;
  var pendingOffer = null, pendingCallerId = null, pendingCallerName = null;
  var iceCandidateQueue = [];
  var remoteAudios = {};

  var pendingGroupCallInvite = null;
  var currentCallMediaType = 'audio';
  var pendingCallMediaType = 'audio';
  var privateRemoteStream = new MediaStream();

  var ICE_SERVERS = [

  ];

  function setMutedLine(show) {
    document.getElementById('call-muted-line').style.display = show ? 'block' : 'none';
  }

  function getCallMediaConstraints(mediaType) {
    return mediaType === 'video'
      ? {
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
        }
      : {
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
          video: false
        };
  }

  function getAudioOnlyConstraints() {
    return { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false };
  }

  function cancelActiveRecorderCapture() {
    try {
      if (voiceRecorder) {
        voiceRecorder.ondataavailable = null;
        voiceRecorder.onstop = null;
        if (voiceRecorder.state === 'recording') voiceRecorder.stop();
      }
    } catch (_) {}
    if (voiceStream) {
      voiceStream.getTracks().forEach(function(t) { t.stop(); });
    }
    voiceRecorder = null;
    voiceStream = null;
    voiceChunks = [];
    document.getElementById('btn-mic').classList.remove('recording');
  }

  async function requestSplitMediaStream() {
    var camStream = null;
    var micStream = null;
    try {
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
      micStream = await navigator.mediaDevices.getUserMedia(getAudioOnlyConstraints());
      return new MediaStream((camStream.getTracks() || []).concat(micStream.getTracks() || []));
    } catch (e) {
      if (camStream) camStream.getTracks().forEach(function(t) { t.stop(); });
      if (micStream) micStream.getTracks().forEach(function(t) { t.stop(); });
      throw e;
    }
  }

  async function requestUserMediaWithFallback(mediaType) {
    cancelActiveRecorderCapture();
    var tries = [];
    if (mediaType === 'video') {
      tries = [
        getCallMediaConstraints('video'),
        { audio: true, video: true },
        { audio: getAudioOnlyConstraints().audio, video: { facingMode: 'user' } },
        { audio: true, video: { facingMode: { ideal: 'user' } } },
        'split-media'
      ];
    } else {
      tries = [
        getAudioOnlyConstraints(),
        { audio: true, video: false },
        { audio: true }
      ];
    }

    var lastErr = null;
    for (var i = 0; i < tries.length; i++) {
      try {
        if (tries[i] === 'split-media') {
          return await requestSplitMediaStream();
        }
        return await navigator.mediaDevices.getUserMedia(tries[i]);
      } catch (e) {
        lastErr = e;
      }
    }
    throw lastErr || new Error('No se pudo iniciar media');
  }

  function mediaPermissionMessage(err, mediaType) {
    var typeLabel = mediaType === 'video' ? 'camara y microfono' : 'microfono';
    if (!err || !err.name) return 'Se necesitan permisos de ' + typeLabel;
    if (err.name === 'NotAllowedError' || err.name === 'SecurityError') return 'Permite ' + typeLabel + ' para continuar';
    if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') return mediaType === 'video' ? 'No se encontro camara/microfono' : 'No se encontro microfono';
    if (err.name === 'NotReadableError' || err.name === 'TrackStartError') return mediaType === 'video' ? 'No se pudo iniciar la camara o el microfono. Cierra otras pestañas del chat y vuelve a intentar.' : 'No se pudo iniciar el microfono. Vuelve a intentar.';
    if (err.name === 'OverconstrainedError' || err.name === 'ConstraintNotSatisfiedError') return 'No se pudo iniciar con esa configuracion de camara';
    return 'No se pudo iniciar: ' + err.name;
  }

  function normalizeRemoteStream(event) {
    if (event.streams && event.streams[0]) return event.streams[0];
    if (event.track) return new MediaStream([event.track]);
    return null;

  function bindRemoteStream(stream) {
    if (!stream) return;
    var hasVideo = stream.getVideoTracks && stream.getVideoTracks().length > 0;
    if (currentCallMediaType === 'video' || hasVideo) {
      var remoteVideo = document.getElementById('call-video-remote');
      var audioTracks = stream.getAudioTracks ? stream.getAudioTracks() : [];
      if (audioTracks.length) {

      remoteVideo.muted = true;
      remoteVideo.volume = 1;
      remoteVideo.srcObject = stream;
      remoteVideo.play().catch(function() {});
      return;
    }
    playRemoteAudio('private', stream);
  }

  function handlePrivateRemoteTrack(event) {
    if (event && event.track) {
      var exists = privateRemoteStream.getTracks().some(function(t) { return t.id === event.track.id; });
      if (!exists) privateRemoteStream.addTrack(event.track);
      event.track.onunmute = function() {
        bindRemoteStream(privateRemoteStream);
      };
      bindRemoteStream(privateRemoteStream);
      return;
    }
    bindRemoteStream(normalizeRemoteStream(event));
  }

  function playRemoteAudio(key, stream) {
    if (!stream) return;
    var audio = remoteAudios[key] || new Audio();
    if (!remoteAudios[key]) {
      audio.style.display = 'none';
      audio.setAttribute('autoplay', 'autoplay');
      audio.setAttribute('playsinline', 'playsinline');
      audio.preload = 'auto';
      document.body.appendChild(audio);
    }
    audio.autoplay = true;
    audio.playsInline = true;
    audio.muted = false;
    audio.volume = 1;
    audio.srcObject = stream;
    remoteAudios[key] = audio;
    audio.play().catch(function() {});
  }

  function clearRemoteAudio(key) {
    var audio = remoteAudios[key];
    if (!audio) return;
    audio.pause();
    audio.srcObject = null;
    if (audio.parentNode) audio.parentNode.removeChild(audio);
    delete remoteAudios[key];
  }

  document.addEventListener('click', function() {
    Object.keys(remoteAudios).forEach(function(key) {
      var a = remoteAudios[key];
      if (a && a.srcObject) a.play().catch(function() {});
    });
  });

  function subscribeCallChannel() {
    if (callChannel) return;
    callChannel = sb.channel('calls-' + currentUser.id, { config: { broadcast: { self: false } } });
    callChannel.on('broadcast', { event: 'call-signal' }, async (msg) => {
      var d = msg.payload;
      if (!d) return;
      if (d.type === 'offer') {
        if (callState !== 'idle' || groupCallActive || pendingGroupCallInvite) {
          sendCallSignal(d.fromId, { type: 'busy' });
          return;
        }
        pendingOffer = d.offer;
        pendingCallerId = d.fromId;
        pendingCallerName = d.callerName;
        pendingCallMediaType = d.callMode === 'video' ? 'video' : 'audio';
        iceCandidateQueue = [];
        showIncomingCall(d.callerName, pendingCallMediaType);
      } else if (d.type === 'answer') {
        if (callPeer && callPeer.signalingState !== 'stable') {
          await callPeer.setRemoteDescription(new RTCSessionDescription(d.answer));
          iceCandidateQueue.forEach(function(c) { callPeer.addIceCandidate(new RTCIceCandidate(c)); });
          iceCandidateQueue = [];
          setCallActive();
        }
      } else if (d.type === 'ice-candidate') {
        if (callPeer && callPeer.remoteDescription) {
          callPeer.addIceCandidate(new RTCIceCandidate(d.candidate));
        } else {
          iceCandidateQueue.push(d.candidate);
        }
      } else if (d.type === 'end' || d.type === 'busy' || d.type === 'reject') {
        if (d.type === 'busy') toast('El usuario esta en otra llamada');
        if (d.type === 'reject') toast('Llamada rechazada');
        cleanupCall();
      }
    });
    callChannel.subscribe();
  }

  function sendCallSignal(targetUserId, payload) {
    var msg = {
      type: 'broadcast',
      event: 'call-signal',
      payload: Object.assign({}, payload, { fromId: currentUser.id })
    };
    if (callSendCh && callSendTarget === targetUserId) {
      if (callSendReady) { callSendCh.send(msg); }
      else { callSendQueue.push(msg); }
      return;
    }
    if (callSendCh) { sb.removeChannel(callSendCh); }
    callSendTarget = targetUserId;
    callSendReady = false;
    callSendQueue = [msg];
    callSendCh = sb.channel('calls-' + targetUserId);
    callSendCh.subscribe(function(status) {
      if (status === 'SUBSCRIBED') {
        callSendReady = true;
        callSendQueue.forEach(function(m) { callSendCh.send(m); });
        callSendQueue = [];
      }
    });
  }

  function schedulePendingCallCleanup(delayMs) {
    if (pendingEndCleanupTimer) clearTimeout(pendingEndCleanupTimer);
    pendingEndCleanupTimer = setTimeout(function() {
      pendingEndCleanupTimer = null;
      cleanupCall();
    }, delayMs || 350);
  }

  async function startCall(mediaType) {
    mediaType = mediaType || 'audio';
    unlockSounds();
    if (chatMode === 'group' && activeGroup) return startGroupCall();
    if (!activeFriend || chatMode !== 'private') return toast('Selecciona un chat privado');
    if (activeFriend.id === BOT_ID) return toast('No puedes llamar al bot');
    if (callState !== 'idle') return toast('Ya hay una llamada en curso');

    try {
      localStream = await requestUserMediaWithFallback(mediaType);
    } catch(e) {
      return toast(mediaPermissionMessage(e, mediaType));
    }

    callState = 'calling';
    currentCallMediaType = mediaType;
    isMuted = false;
    try {
      await sb.from('call_notifications').insert({
        caller_id: currentUser.id,
        receiver_id: activeFriend.id,
        media_type: mediaType === 'video' ? 'video' : 'audio'
      });
    } catch (_) {}
    startLoopingSound('outgoingCallPrivate');
    showOutgoingCall(activeFriend.name, mediaType);
    bindLocalPreview(localStream);

    callPeer = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    localStream.getTracks().forEach(function(t) { callPeer.addTrack(t, localStream); });

    callPeer.onicecandidate = function(e) {
      if (e.candidate) {
        sendCallSignal(activeFriend.id, { type: 'ice-candidate', candidate: e.candidate.toJSON() });
      }
    };

    callPeer.ontrack = function(e) {
      handlePrivateRemoteTrack(e);
    };

    callPeer.onconnectionstatechange = function() {
      if (callPeer.connectionState === 'disconnected' || callPeer.connectionState === 'failed') {
        endCall();
      }
    };

    var offer = await callPeer.createOffer();
    await callPeer.setLocalDescription(offer);

    sendCallSignal(activeFriend.id, {
      type: 'offer',
      offer: callPeer.localDescription.toJSON(),
      callerName: currentUser.username,
      callMode: mediaType
    });

    setTimeout(function() {
      if (callState === 'calling') {
        toast('No hubo respuesta');
        endCall();
      }
    }, 30000);
  }

  function startVideoCall() {
    return startCall('video');
  }

  async function answerCall() {
    unlockSounds();
    if (pendingGroupCallInvite) {
      var inv = pendingGroupCallInvite;
      pendingGroupCallInvite = null;
      stopLoopingSound();
      document.getElementById('call-modal').style.display = 'none';
      document.getElementById('call-avatar').style.background = '#1b66c9';
      var { data: grp } = await sb.from('groups').select('*').eq('id', inv.groupId).maybeSingle();
      if (grp) {
        await openGroupChat(grp.id, grp.name, grp.code);
        await joinGroupCall();
      }
      return;
    }
    if (!pendingOffer) return;

    currentCallMediaType = pendingCallMediaType === 'video' ? 'video' : 'audio';
    stopLoopingSound();

    try {
      localStream = await requestUserMediaWithFallback(currentCallMediaType);
    } catch(e) {
      sendCallSignal(pendingCallerId, { type: 'reject' });
      cleanupCall();
      return toast(mediaPermissionMessage(e, currentCallMediaType));
    }

    callState = 'active';
    isMuted = false;
    bindLocalPreview(localStream);
    setCallMediaUI(currentCallMediaType);

    callPeer = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    localStream.getTracks().forEach(function(t) { callPeer.addTrack(t, localStream); });

    callPeer.onicecandidate = function(e) {
      if (e.candidate) {
        sendCallSignal(pendingCallerId, { type: 'ice-candidate', candidate: e.candidate.toJSON() });
      }
    };

    callPeer.ontrack = function(e) {
      handlePrivateRemoteTrack(e);
    };

    callPeer.onconnectionstatechange = function() {
      if (callPeer.connectionState === 'disconnected' || callPeer.connectionState === 'failed') {
        endCall();
      }
    };

    await callPeer.setRemoteDescription(new RTCSessionDescription(pendingOffer));
    iceCandidateQueue.forEach(function(c) { callPeer.addIceCandidate(new RTCIceCandidate(c)); });
    iceCandidateQueue = [];

    var answer = await callPeer.createAnswer();
    await callPeer.setLocalDescription(answer);

    sendCallSignal(pendingCallerId, { type: 'answer', answer: callPeer.localDescription.toJSON() });
    setCallActive();
  }

  function endCall() {
    if (pendingGroupCallInvite) {
      pendingGroupCallInvite = null;
      stopLoopingSound();
      document.getElementById('call-modal').style.display = 'none';
      document.getElementById('call-avatar').style.background = '#1b66c9';
      return;
    }
    if (groupCallActive) return leaveGroupCall();
    var targetId = null;
    if (callState === 'calling' && activeFriend) targetId = activeFriend.id;
    if (callState === 'ringing' && pendingCallerId) targetId = pendingCallerId;
    if (callState === 'active') targetId = activeFriend ? activeFriend.id : pendingCallerId;
    if (targetId) {
      sendCallSignal(targetId, { type: 'end' });
      schedulePendingCallCleanup(420);
      return;
    }
    cleanupCall();
  }

  function cleanupCall() {
    stopLoopingSound();
    if (pendingEndCleanupTimer) {
      clearTimeout(pendingEndCleanupTimer);
      pendingEndCleanupTimer = null;
    }
    if (callPeer) {
      clearRemoteAudio('private');
      callPeer.close();
      callPeer = null;
    }
    if (localStream) {
      localStream.getTracks().forEach(function(t) { t.stop(); });
      localStream = null;
    }
    if (callSendCh) { sb.removeChannel(callSendCh); callSendCh = null; }
    callSendTarget = null; callSendReady = false; callSendQueue = [];
    callState = 'idle';
    currentCallMediaType = 'audio';
    pendingCallMediaType = 'audio';
    pendingOffer = null;
    pendingCallerId = null;
    pendingCallerName = null;
    pendingGroupCallInvite = null;
    iceCandidateQueue = [];
    isMuted = false;
    if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
    callSeconds = 0;
    var remoteVideo = document.getElementById('call-video-remote');
    var localVideo = document.getElementById('call-video-local');
    remoteVideo.srcObject = null;
    localVideo.srcObject = null;
    if (privateRemoteStream) {
      privateRemoteStream.getTracks().forEach(function(t) { privateRemoteStream.removeTrack(t); });
    }
    setCallOverlayMode('active');
    setCallMediaUI('audio');
    document.getElementById('call-avatar').style.background = '#1b66c9';
    setMutedLine(false);
    document.getElementById('call-modal').style.display = 'none';
  }

  function setCallActive() {

    callState = 'active';

  function toggleMute() {

    var btn = document.getElementById('call-mute-btn');
    btn.className = 'call-btn call-btn-mute' + (isMuted ? ' muted' : '');

  // --- LLAMADAS GRUPALES (WebRTC mesh) ---
  var groupCallActive = false, groupCallGroupId = null, groupCallChannel = null;
  var groupCallPeers = {};
  var groupCallStream = null, groupCallTimerInterval = null, groupCallSeconds = 0, groupCallMuted = false;

  async function checkGroupCallStatus(groupId) {
    var banner = document.getElementById('gcall-banner');
    var { data } = await sb.from('group_calls').select('user_id, profiles(username)').eq('group_id', groupId);
    var p = data || [];
    if (p.length > 0) {
      var iAmIn = p.some(function(r) { return r.user_id === currentUser.id; });
      document.getElementById('gcall-count').textContent = p.length + ' participante' + (p.length > 1 ? 's' : '');
      document.getElementById('gcall-join-btn').style.display = iAmIn ? 'none' : 'inline-block';
      banner.classList.add('visible');
    } else {
      banner.classList.remove('visible');
    }
  }

  function hideGroupCallBanner() {
    document.getElementById('gcall-banner').classList.remove('visible');
  }

  async function startGroupCall() {
    unlockSounds();
    if (!activeGroup) return;
    if (groupCallActive) return toast('Ya est\u00E1s en una llamada grupal');
    if (callState !== 'idle') return toast('Ya hay una llamada en curso');
    var stream;
    try { stream = await requestUserMediaWithFallback('audio'); }
    catch(e) { return toast(mediaPermissionMessage(e, 'audio')); }
    groupCallStream = stream;
    var { error } = await sb.from('group_calls').upsert({ group_id: activeGroup.id, user_id: currentUser.id });
    if (error) { toast('Error al iniciar llamada'); stream.getTracks().forEach(function(t){t.stop();}); groupCallStream = null; return; }
    groupCallActive = true;
    groupCallGroupId = activeGroup.id;
    groupCallMuted = false;
    subscribeGroupCallCh(activeGroup.id);
    showGroupCallModal(activeGroup.name);
    setTimeout(function() {
      if (groupCallChannel) groupCallChannel.send({ type: 'broadcast', event: 'gcall-signal', payload: { type: 'join', userId: currentUser.id, username: currentUser.username } });
    }, 600);
    checkGroupCallStatus(activeGroup.id);
  }

  async function joinGroupCall() {
    unlockSounds();
    if (!activeGroup) return;
    if (groupCallActive) return;
    if (callState !== 'idle') return toast('Ya hay una llamada en curso');
    var stream;
    try { stream = await requestUserMediaWithFallback('audio'); }
    catch(e) { return toast(mediaPermissionMessage(e, 'audio')); }
    groupCallStream = stream;
    var { error } = await sb.from('group_calls').upsert({ group_id: activeGroup.id, user_id: currentUser.id });
    if (error) { toast('Error al unirse'); stream.getTracks().forEach(function(t){t.stop();}); groupCallStream = null; return; }
    groupCallActive = true;
    groupCallGroupId = activeGroup.id;
    groupCallMuted = false;
    subscribeGroupCallCh(activeGroup.id);
    showGroupCallModal(activeGroup.name);
    setTimeout(function() {
      if (groupCallChannel) groupCallChannel.send({ type: 'broadcast', event: 'gcall-signal', payload: { type: 'join', userId: currentUser.id, username: currentUser.username } });
    }, 600);
    checkGroupCallStatus(activeGroup.id);
  }

  function subscribeGroupCallCh(groupId) {
    if (groupCallChannel) return;
    groupCallChannel = sb.channel('gcall-' + groupId, { config: { broadcast: { self: false } } });
    groupCallChannel.on('broadcast', { event: 'gcall-signal' }, handleGCallSignal);
    groupCallChannel.subscribe();
  }

  async function handleGCallSignal(msg) {
    var d = msg.payload;
    if (d.type === 'join' && d.userId !== currentUser.id) {
      await createGPeer(d.userId, true);
    } else if (d.type === 'offer' && d.toId === currentUser.id) {
      await handleGOffer(d);
    } else if (d.type === 'answer' && d.toId === currentUser.id) {
      await handleGAnswer(d);
    } else if (d.type === 'ice' && d.toId === currentUser.id) {
      handleGIce(d);
    } else if (d.type === 'leave' && d.userId !== currentUser.id) {
      removeGPeer(d.userId);
      updateGCallCount();
    }
  }

  async function createGPeer(peerId, makeOffer) {
    if (groupCallPeers[peerId]) { groupCallPeers[peerId].pc.close(); clearRemoteAudio('group-' + peerId); }
    var pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    if (groupCallStream) groupCallStream.getTracks().forEach(function(t) { pc.addTrack(t, groupCallStream); });
    pc.onicecandidate = function(e) { if (e.candidate && groupCallChannel) groupCallChannel.send({ type: 'broadcast', event: 'gcall-signal', payload: { type: 'ice', candidate: e.candidate.toJSON(), fromId: currentUser.id, toId: peerId } }); };
    pc.ontrack = function(e) {
      var s = normalizeRemoteStream(e);
      if (!s) return;
      var aTracks = s.getAudioTracks ? s.getAudioTracks() : [];
      if (aTracks.length) playRemoteAudio('group-' + peerId, new MediaStream(aTracks));
      else playRemoteAudio('group-' + peerId, s);
    };
    pc.onconnectionstatechange = function() { if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed') removeGPeer(peerId); };
    groupCallPeers[peerId] = { pc: pc, audio: null, buf: [] };
    if (makeOffer) {
      var offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      groupCallChannel.send({ type: 'broadcast', event: 'gcall-signal', payload: { type: 'offer', offer: pc.localDescription.toJSON(), fromId: currentUser.id, toId: peerId } });
    }
  }

  async function handleGOffer(d) {
    await createGPeer(d.fromId, false);
    var p = groupCallPeers[d.fromId];
    await p.pc.setRemoteDescription(new RTCSessionDescription(d.offer));
    p.buf.forEach(function(c) { p.pc.addIceCandidate(new RTCIceCandidate(c)); }); p.buf = [];
    var answer = await p.pc.createAnswer();
    await p.pc.setLocalDescription(answer);
    groupCallChannel.send({ type: 'broadcast', event: 'gcall-signal', payload: { type: 'answer', answer: p.pc.localDescription.toJSON(), fromId: currentUser.id, toId: d.fromId } });
  }

  async function handleGAnswer(d) {
    var p = groupCallPeers[d.fromId]; if (!p) return;
    await p.pc.setRemoteDescription(new RTCSessionDescription(d.answer));
    p.buf.forEach(function(c) { p.pc.addIceCandidate(new RTCIceCandidate(c)); }); p.buf = [];
  }

  function handleGIce(d) {
    var p = groupCallPeers[d.fromId]; if (!p) return;
    if (p.pc.remoteDescription) p.pc.addIceCandidate(new RTCIceCandidate(d.candidate));
    else p.buf.push(d.candidate);
  }

  function removeGPeer(peerId) {
    var p = groupCallPeers[peerId]; if (!p) return;
    clearRemoteAudio('group-' + peerId);
    p.pc.close();
    delete groupCallPeers[peerId];
  }

  async function leaveGroupCall() {
    if (!groupCallActive) return;
    if (groupCallChannel) groupCallChannel.send({ type: 'broadcast', event: 'gcall-signal', payload: { type: 'leave', userId: currentUser.id } });
    await sb.from('group_calls').delete().eq('group_id', groupCallGroupId).eq('user_id', currentUser.id);
    Object.keys(groupCallPeers).forEach(function(pid) { removeGPeer(pid); });
    groupCallPeers = {};
    if (groupCallStream) { groupCallStream.getTracks().forEach(function(t) { t.stop(); }); groupCallStream = null; }
    if (groupCallChannel) { sb.removeChannel(groupCallChannel); groupCallChannel = null; }
    var wasId = groupCallGroupId;
    groupCallActive = false; groupCallGroupId = null; groupCallMuted = false;
    if (groupCallTimerInterval) { clearInterval(groupCallTimerInterval); groupCallTimerInterval = null; }
    groupCallSeconds = 0;
    document.getElementById('call-avatar').style.background = '#1b66c9';
    setMutedLine(false);
    document.getElementById('call-modal').style.display = 'none';
    if (activeGroup && activeGroup.id === wasId) checkGroupCallStatus(wasId);
  }

  function showGroupCallModal(name) {
    setCallOverlayMode('active');
    setCallMediaUI('audio');
    document.getElementById('call-avatar').textContent = '#';
    document.getElementById('call-avatar').style.background = '#4caf50';
    document.getElementById('call-name').textContent = name;
    document.getElementById('call-status').textContent = 'En llamada grupal';
    document.getElementById('call-timer').style.display = 'block';
    document.getElementById('call-timer').textContent = '00:00';
    document.getElementById('call-accept-btn').style.display = 'none';
    document.getElementById('call-mute-btn').style.display = 'flex';
    document.getElementById('call-mute-btn').className = 'call-btn call-btn-mute';
    setMutedLine(false);
    document.getElementById('call-modal').style.display = 'flex';
    groupCallSeconds = 0;
    groupCallTimerInterval = setInterval(function() {
      groupCallSeconds++;
      var m = String(Math.floor(groupCallSeconds / 60)).padStart(2, '0');
      var s = String(groupCallSeconds % 60).padStart(2, '0');
      document.getElementById('call-timer').textContent = m + ':' + s;
    }, 1000);
    updateGCallCount();
  }

  function toggleGroupMute() {
    if (!groupCallStream) return;
    groupCallMuted = !groupCallMuted;
    groupCallStream.getAudioTracks().forEach(function(t) { t.enabled = !groupCallMuted; });
    var btn = document.getElementById('call-mute-btn');
    btn.className = 'call-btn call-btn-mute' + (groupCallMuted ? ' muted' : '');
    btn.title = groupCallMuted ? 'Activar micr\u00F3fono' : 'Silenciar';
    setMutedLine(groupCallMuted);
  }

  function updateGCallCount() {
    if (!groupCallGroupId) return;
    sb.from('group_calls').select('user_id').eq('group_id', groupCallGroupId).then(function(res) {
      var p = res.data || [];
      document.getElementById('call-status').textContent = 'En llamada grupal (' + p.length + ')';
    });
  }

  // --- NOTIFICACIONES ---
  async function requestNotificationPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      await Notification.requestPermission();
    }
    if ('serviceWorker' in navigator) {
      try { await navigator.serviceWorker.register('/sw.js'); } catch(e) {}
    }
  }

  function showDesktopNotification(title, body, tag, target) {
    notifyFlutter({
      kind: 'notify',
      event: tag && tag.indexOf('grp-') === 0 ? 'grp-msg' : (tag && tag.indexOf('msg-') === 0 ? 'msg' : tag),
      title: title,
      body: body,
      tag: tag || 'chatty-msg',
      target: target || null
    });
    if (Notification.permission !== 'granted') return;
    var n = new Notification(title, { body: body, tag: tag || 'chatty-msg', renotify: true });
    n.onclick = function() {
      n.close();
      openNotificationTarget(target);
    };
    setTimeout(function() { n.close(); }, 5000);
  }

  async function getUsername(userId) {
    var { data } = await sb.from('profiles').select('username').eq('id', userId).maybeSingle();
    return data ? data.username : 'Alguien';
  }

  function previewText(content) {
    if (content && content.indexOf('<<FILE>>') === 0) return 'Archivo';
    if (content && content.length > 60) return content.substring(0, 60) + '...';
    return content || '';
  }

  // --- REALTIME ---
  function subscribeRealtime() {
    sb.channel('db')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, async (payload) => {
        if (chatMode === 'private' && activeFriend) loadMessages();
        if (payload.eventType === 'INSERT' && payload.new.sender_id !== currentUser.id) {
          playAppSound('messageReceived');
          var sender = await getUsername(payload.new.sender_id);
          if (!isChatCurrentlyOpen('private', payload.new.sender_id)) {
            incrementUnread('private', payload.new.sender_id);
            loadFriends();
          }
          showInAppEvent('Nuevo mensaje de ' + sender, 'success');
          showDesktopNotification('ChattyFriends', sender + ': ' + previewText(payload.new.content), 'msg-' + payload.new.id, {
            type: 'private',
            id: payload.new.sender_id,
            name: sender
          });
        }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'group_messages' }, async (payload) => {
        if (chatMode === 'group' && activeGroup) loadGroupMessages();
        if (payload.eventType === 'INSERT' && payload.new.sender_id !== currentUser.id) {
          playAppSound('messageReceived');
          var sender = await getUsername(payload.new.sender_id);
          var groupRes = await sb.from('groups').select('name, code').eq('id', payload.new.group_id).maybeSingle();
          var groupName = groupRes.data ? groupRes.data.name : 'Grupo';
          var groupCode = groupRes.data ? groupRes.data.code : '';
          if (!isChatCurrentlyOpen('groups', payload.new.group_id)) {
            incrementUnread('groups', payload.new.group_id);
            loadGroups();
          }
          showInAppEvent('Nuevo mensaje en ' + groupName + ' de ' + sender, 'success');
          showDesktopNotification('ChattyFriends', groupName + ' - ' + sender + ': ' + previewText(payload.new.content), 'grp-' + payload.new.id, {
            type: 'group',
            id: payload.new.group_id,
            name: groupName,
            code: groupCode
          });
        }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'group_calls' }, async function(payload) {
        if (activeGroup) checkGroupCallStatus(activeGroup.id);
        if (groupCallActive) updateGCallCount();
        if (payload.eventType === 'INSERT' && payload.new && payload.new.user_id !== currentUser.id) {
          if (callState !== 'idle' || groupCallActive || pendingGroupCallInvite) return;
          var gid = payload.new.group_id;
          var callerId = payload.new.user_id;
          var results = await Promise.all([
            sb.from('group_members').select('id').eq('group_id', gid).eq('user_id', currentUser.id).maybeSingle(),
            sb.from('groups').select('name').eq('id', gid).maybeSingle(),
            sb.from('profiles').select('username').eq('id', callerId).maybeSingle(),
            sb.from('group_calls').select('user_id').eq('group_id', gid)
          ]);
          if (!results[0].data) return;
          var others = (results[3].data || []).filter(function(r) { return r.user_id !== callerId; });
          if (others.length > 0) return;
          var groupName = results[1].data ? results[1].data.name : 'Grupo';
          var callerName = results[2].data ? results[2].data.username : 'Alguien';
          showIncomingGroupCall(gid, groupName, callerName);
        }
      })
      .subscribe();
  }

  loadUnreadState();
  const saved = localStorage.getItem('chatty_user');
  if(saved) { currentUser = sanitizeUser(JSON.parse(saved)); startApp(); }

  window.addEventListener('resize', function() {
    if (!isMobileOrTabletViewport()) {
      setMobileChatMode(false);
      return;
    }
    if (chatMode === 'private' || chatMode === 'group') {
      setMobileChatMode(true);
    } else {
      setMobileChatMode(false);
    }
  });
</script>

</body>
</html>
